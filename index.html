<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>HEX ARCHITECT: YIELD OVERFLOW</title>
<style>
  :root {
    --bg: #0f1419;
    --panel: #171f27;
    --border: #2c3a47;
    --text: #e2e8f0;
    --muted: #8b9bb4;
    --gold: #f5b041;
    --emerald: #2ecc71;
    --cyan: #38bdf8;
    --red: #f87171;
  }
  * { box-sizing: border-box; user-select: none; }
  body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', 'Meiryo', sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .title { font-weight: bold; font-size: 1.1rem; color: var(--gold); letter-spacing: 1px; }
  .stats { display: flex; gap: 20px; align-items: center; font-size: 0.95rem; }
  .stat-box { background: rgba(0,0,0,0.3); padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border); }
  .stat-val { font-weight: bold; color: var(--emerald); font-size: 1.1rem; }
  .controls { display: flex; gap: 10px; }
  button {
    background: #232f3d;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.15s;
  }
  button:hover { background: #2f3f52; border-color: var(--cyan); }
  button.active { background: #1e3a5f; border-color: var(--cyan); color: #fff; font-weight: bold; }
  button.primary { background: #1e5631; border-color: var(--emerald); color: #fff; font-weight: bold; }
  button.primary:hover { background: #266d3e; }

  .main {
    display: grid;
    grid-template-columns: 280px 1fr 290px;
    flex: 1;
    overflow: hidden;
  }
  .sidebar {
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow-y: auto;
  }
  .sidebar.right { border-right: none; border-left: 1px solid var(--border); }
  h3 { margin: 0 0 5px 0; font-size: 0.9rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

  .district-card {
    background: #1d2731;
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .district-card:hover { border-color: #4b6278; transform: translateX(2px); }
  .district-card.selected { border-color: var(--gold); background: #26313d; box-shadow: 0 0 12px rgba(245, 176, 65, 0.2); }
  .d-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 4px; }
  .d-desc { font-size: 0.78rem; color: var(--muted); line-height: 1.35; }

  .policy-card {
    background: #1d2731;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .policy-card.active { border-color: var(--emerald); background: rgba(46, 204, 113, 0.12); }
  .policy-card .p-title { font-weight: bold; font-size: 0.85rem; color: var(--cyan); margin-bottom: 3px; }
  .policy-card.active .p-title { color: var(--emerald); }
  .policy-card .p-desc { font-size: 0.76rem; color: var(--muted); line-height: 1.3; }

  .canvas-wrap {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at center, #16202a 0%, #0b0f14 100%);
  }
  canvas { display: block; cursor: crosshair; }
  .hint-bar {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(15, 20, 25, 0.85);
    border: 1px solid var(--border);
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 0.8rem;
    color: var(--muted);
    pointer-events: none;
  }
</style>
</head>
<body>

<header>
  <div class="title">⬡ HEX ARCHITECT: 隣接ボーナスパズル</div>
  <div class="stats">
    <div class="stat-box">合計産出: <span id="totalYield" class="stat-val">0</span></div>
    <div class="stat-box">残り建設枠: <span id="buildsLeft" class="stat-val" style="color:var(--gold)">6</span></div>
  </div>
  <div class="controls">
    <button id="btnModeBuild" class="active" onclick="setMode('build')">🔨 建設モード</button>
    <button id="btnModePin" onclick="setMode('pin')">📌 都市計画ピン</button>
    <button id="btnUndo" onclick="undoLast()">↩ 1手戻す</button>
    <button onclick="resetMap()">🔄 新しい地形</button>
  </div>
</header>

<div class="main">
  <!-- 左パネル：区域リスト -->
  <div class="sidebar">
    <h3>建設する区域を選択</h3>
    <div id="districtList"></div>
  </div>

  <!-- 中央：ヘックス盤面 -->
  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="hexCanvas"></canvas>
    <div class="hint-bar">左クリック: 区域を建設（またはピン配置） / 右クリック: 撤去</div>
  </div>

  <!-- 右パネル：政策カード（ルール書き換え） -->
  <div class="sidebar right">
    <h3>政策カード（クリックでON/OFF）</h3>
    <div style="font-size:0.75rem; color:var(--muted); margin-bottom:5px;">
      隣接ルールを歪めて出力を爆発させます
    </div>
    <div id="policyList"></div>
  </div>
</div>

<script>
// --- データ定義 ---
const TERRAINS = {
  plains:   { name: '平地', color: '#263829', border: '#38523c', icon: '' },
  mountain: { name: '山岳', color: '#474f59', border: '#687382', icon: '⛰️', impassable: true },
  geothermal:{ name: '地熱孔', color: '#5c2b29', border: '#8c3f3b', icon: '🌋', impassable: true },
  forest:   { name: '森', color: '#1d3b2a', border: '#2e5c42', icon: '🌲' },
  river:    { name: 'オアシス/川', color: '#1b3b52', border: '#2b5d82', icon: '💧', impassable: true }
};

const DISTRICTS = {
  campus: {
    id: 'campus', name: '🧪 キャンパス', color: '#2980b9',
    desc: '山岳 +2 / 地熱孔 +3 / 森(2つ毎) +1 / 他区域(2つ毎) +1'
  },
  industrial: {
    id: 'industrial', name: '⚙️ 工業地帯', color: '#d35400',
    desc: '用水路 +3 / 山岳 +1 / 他区域(2つ毎) +1'
  },
  aqueduct: {
    id: 'aqueduct', name: '🌊 用水路', color: '#16a085',
    desc: '基本産出 1。隣接する工業地帯に+3を与える（川/山岳の隣で自身+2）'
  },
  gov: {
    id: 'gov', name: '🏛️ 政府複合施設', color: '#8e44ad',
    desc: '基本産出 2。隣接する「すべての区域」の隣接ボーナスを +2 強化する'
  },
  holy: {
    id: 'holy', name: '✨ 聖地', color: '#f1c40f',
    desc: '山岳 +2 / 森 +1 / オアシス・川 +2'
  }
};

const POLICIES = [
  {
    id: 'rationalism',
    name: '📜 合理主義',
    desc: '隣接ボーナスが +4 以上の区域は、最終出力が「2倍」になる'
  },
  {
    id: 'golden_triangle',
    name: '📐 黄金の三角計画',
    desc: '「工業地帯」と「用水路」が互いに隣接している場合、双方に +3'
  },
  {
    id: 'geothermal_resonance',
    name: '🔥 地熱共鳴ネットワーク',
    desc: '地熱孔の隣にある区域のボーナスを、隣接する他区域にもコピー（+3）する'
  },
  {
    id: 'urban_density',
    name: '🏙️ 過密都市計画',
    desc: '「他区域2つ毎+1」の条件が「他区域1つ毎+1」に強化される'
  }
];

// --- ゲーム状態 ---
let grid = []; // { q, r, terrain, district, pin }
let selectedDistrict = 'campus';
let activePolicies = new Set(['rationalism']);
let mode = 'build'; // 'build' or 'pin'
let buildsRemaining = 6;
let history = [];
let hoveredHex = null;

const HEX_RADIUS = 44;
const GRID_RADIUS = 3; // 半径3のヘックス盤面（計37マス）

const canvas = document.getElementById('hexCanvas');
const ctx = canvas.getContext('2d');

// --- 初期化 ---
function init() {
  renderDistrictCards();
  renderPolicyCards();
  resetMap();
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  canvas.addEventListener('mousemove', onMouseMove);
  canvas.addEventListener('mousedown', onMouseDown);
  canvas.addEventListener('contextmenu', e => e.preventDefault());
}

function resizeCanvas() {
  const wrap = document.getElementById('canvasWrap');
  canvas.width = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
  draw();
}

function resetMap() {
  grid = [];
  history = [];
  buildsRemaining = 6;
  for (let q = -GRID_RADIUS; q <= GRID_RADIUS; q++) {
    const r1 = Math.max(-GRID_RADIUS, -q - GRID_RADIUS);
    const r2 = Math.min(GRID_RADIUS, -q + GRID_RADIUS);
    for (let r = r1; r <= r2; r++) {
      let terrain = 'plains';
      const rand = Math.random();
      if (q === 0 && r === 0) {
        terrain = 'plains';
      } else if (rand < 0.16) {
        terrain = 'mountain';
      } else if (rand < 0.24) {
        terrain = 'geothermal';
      } else if (rand < 0.34) {
        terrain = 'river';
      } else if (rand < 0.55) {
        terrain = 'forest';
      }
      grid.push({ q, r, terrain, district: null, pin: null });
    }
  }
  updateUI();
  draw();
}

// --- 座標変換 ---
function hexToPixel(q, r) {
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const x = HEX_RADIUS * (Math.sqrt(3) * q + Math.sqrt(3) / 2 * r) + cx;
  const y = HEX_RADIUS * (3 / 2 * r) + cy;
  return { x, y };
}

function pixelToHex(px, py) {
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const x = px - cx;
  const y = py - cy;
  const q = (Math.sqrt(3) / 3 * x - 1 / 3 * y) / HEX_RADIUS;
  const r = (2 / 3 * y) / HEX_RADIUS;
  return hexRound(q, r);
}

function hexRound(q, r) {
  let s = -q - r;
  let rq = Math.round(q);
  let rr = Math.round(r);
  let rs = Math.round(s);
  const qDiff = Math.abs(rq - q);
  const rDiff = Math.abs(rr - r);
  const sDiff = Math.abs(rs - s);
  if (qDiff > rDiff && qDiff > sDiff) rq = -rr - rs;
  else if (rDiff > sDiff) rr = -rq - rs;
  return grid.find(h => h.q === rq && h.r === rr) || null;
}

function getNeighbors(hex) {
  const dirs = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
  return dirs.map(([dq, dr]) => grid.find(h => h.q === hex.q + dq && h.r === hex.r + dr)).filter(Boolean);
}

// --- 隣接ボーナス計算エンジン ---
function calculateAllYields(virtualHex = null, virtualDistrict = null) {
  const results = new Map();
  const beams = []; // 視覚化用の接続線 { from, to, val, type }

  // 仮想配置状態を反映したマップ参照用ヘルパー
  const getDistAt = (h) => {
    if (virtualHex && h.q === virtualHex.q && h.r === virtualHex.r) return virtualDistrict;
    return h.district;
  };

  grid.forEach(hex => {
    const dist = getDistAt(hex);
    if (!dist) return;

    const neighbors = getNeighbors(hex);
    let bonus = 0;

    const addBonus = (srcHex, amount, reason) => {
      if (amount === 0) return;
      bonus += amount;
      if (virtualHex && (hex === virtualHex || srcHex === virtualHex)) {
        beams.push({
          from: srcHex,
          to: hex,
          amount,
          isOutgoing: srcHex === virtualHex
        });
      }
    };

    // 1. 区域ごとの基本隣接ルール
    if (dist === 'campus') {
      neighbors.forEach(n => {
        if (n.terrain === 'mountain') addBonus(n, 2, '山岳');
        if (n.terrain === 'geothermal') addBonus(n, 3, '地熱孔');
      });
      const forests = neighbors.filter(n => n.terrain === 'forest' && !getDistAt(n));
      if (forests.length >= 2) {
        addBonus(forests[0], Math.floor(forests.length / 2), '森');
      }
    }
    else if (dist === 'industrial') {
      neighbors.forEach(n => {
        const nd = getDistAt(n);
        if (nd === 'aqueduct') addBonus(n, 3, '用水路');
        if (n.terrain === 'mountain') addBonus(n, 1, '山岳');
      });
    }
    else if (dist === 'aqueduct') {
      bonus += 1;
      neighbors.forEach(n => {
        if (n.terrain === 'river' || n.terrain === 'mountain') addBonus(n, 2, '水源');
      });
    }
    else if (dist === 'gov') {
      bonus += 2;
    }
    else if (dist === 'holy') {
      neighbors.forEach(n => {
        if (n.terrain === 'mountain') addBonus(n, 2, '山岳');
        if (n.terrain === 'river') addBonus(n, 2, '川');
        if (n.terrain === 'forest' && !getDistAt(n)) addBonus(n, 1, '森');
      });
    }

    // 2. 共通の区域隣接ボーナス（政府複合施設 & 都市密度）
    const adjDistricts = neighbors.filter(n => getDistAt(n) !== null);
    adjDistricts.forEach(n => {
      if (getDistAt(n) === 'gov') {
        addBonus(n, 2, '政府複合施設');
      }
    });

    if (adjDistricts.length > 0) {
      if (activePolicies.has('urban_density')) {
        bonus += adjDistricts.length;
      } else {
        bonus += Math.floor(adjDistricts.length / 2);
      }
    }

    // 3. 政策カードによるルール書き換え
    if (activePolicies.has('golden_triangle')) {
      if (dist === 'industrial' && adjDistricts.some(n => getDistAt(n) === 'aqueduct')) {
        bonus += 3;
      }
      if (dist === 'aqueduct' && adjDistricts.some(n => getDistAt(n) === 'industrial')) {
        bonus += 3;
      }
    }

    if (activePolicies.has('geothermal_resonance')) {
      adjDistricts.forEach(n => {
        const nNeighbors = getNeighbors(n);
        if (nNeighbors.some(nn => nn.terrain === 'geothermal')) {
          addBonus(n, 3, '地熱共鳴');
        }
      });
    }

    // 4. 最終倍率（合理主義など）
    let finalYield = bonus;
    if (activePolicies.has('rationalism') && bonus >= 4) {
      finalYield *= 2;
    }

    results.set(hex, { base: bonus, final: finalYield });
  });

  return { results, beams };
}

// --- 操作イベント ---
function onMouseMove(e) {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const hex = pixelToHex(mx, my);
  if (hex !== hoveredHex) {
    hoveredHex = hex;
    draw();
  }
}

function onMouseDown(e) {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const hex = pixelToHex(mx, my);
  if (!hex) return;

  // 右クリック：撤去
  if (e.button === 2) {
    if (hex.district) {
      hex.district = null;
      buildsRemaining++;
      updateUI();
      draw();
    } else if (hex.pin) {
      hex.pin = null;
      draw();
    }
    return;
  }

  // 左クリック
  if (e.button === 0) {
    if (TERRAINS[hex.terrain].impassable) return;

    if (mode === 'pin') {
      hex.pin = (hex.pin === selectedDistrict) ? null : selectedDistrict;
      draw();
      return;
    }

    // 建設モード
    if (hex.district === selectedDistrict) return;
    if (!hex.district && buildsRemaining <= 0) return;

    history.push({ hex, prevDistrict: hex.district, prevBuilds: buildsRemaining });
    if (!hex.district) buildsRemaining--;
    hex.district = selectedDistrict;
    hex.pin = null;

    updateUI();
    draw();
  }
}

function undoLast() {
  if (history.length === 0) return;
  const last = history.pop();
  last.hex.district = last.prevDistrict;
  buildsRemaining = last.prevBuilds;
  updateUI();
  draw();
}

function setMode(newMode) {
  mode = newMode;
  document.getElementById('btnModeBuild').classList.toggle('active', mode === 'build');
  document.getElementById('btnModePin').classList.toggle('active', mode === 'pin');
  draw();
}

// --- UI描画 ---
function renderDistrictCards() {
  const container = document.getElementById('districtList');
  container.innerHTML = '';
  Object.values(DISTRICTS).forEach(d => {
    const el = document.createElement('div');
    el.className = 'district-card' + (d.id === selectedDistrict ? ' selected' : '');
    el.innerHTML = `
      <div class="d-header" style="color:${d.color === '#f1c40f' ? '#f1c40f' : '#fff'}">
        <span>${d.name}</span>
      </div>
      <div class="d-desc">${d.desc}</div>
    `;
    el.onclick = () => {
      selectedDistrict = d.id;
      renderDistrictCards();
      draw();
    };
    container.appendChild(el);
  });
}

function renderPolicyCards() {
  const container = document.getElementById('policyList');
  container.innerHTML = '';
  POLICIES.forEach(p => {
    const isActive = activePolicies.has(p.id);
    const el = document.createElement('div');
    el.className = 'policy-card' + (isActive ? ' active' : '');
    el.innerHTML = `
      <div class="p-title">${isActive ? '✅ ' : '⬜ '}${p.name}</div>
      <div class="p-desc">${p.desc}</div>
    `;
    el.onclick = () => {
      if (activePolicies.has(p.id)) activePolicies.delete(p.id);
      else activePolicies.add(p.id);
      renderPolicyCards();
      updateUI();
      draw();
    };
    container.appendChild(el);
  });
}

function updateUI() {
  const { results } = calculateAllYields();
  let total = 0;
  results.forEach(v => total += v.final);
  document.getElementById('totalYield').textContent = total;
  document.getElementById('buildsLeft').textContent = buildsRemaining;
}

// --- Canvas 描画 ---
function drawHexagon(x, y, r, fill, stroke, lineWidth = 2) {
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const angle = Math.PI / 180 * (60 * i - 30);
    const hx = x + r * Math.cos(angle);
    const hy = y + r * Math.sin(angle);
    if (i === 0) ctx.moveTo(hx, hy);
    else ctx.lineTo(hx, hy);
  }
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.lineWidth = lineWidth; ctx.strokeStyle = stroke; ctx.stroke(); }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const currentCalc = calculateAllYields();
  const canPreview = hoveredHex && !TERRAINS[hoveredHex.terrain].impassable && hoveredHex.district !== selectedDistrict;
  const previewCalc = canPreview ? calculateAllYields(hoveredHex, selectedDistrict) : null;

  // 1. ヘックスタイルの描画
  grid.forEach(hex => {
    const { x, y } = hexToPixel(hex.q, hex.r);
    const t = TERRAINS[hex.terrain];
    let fill = t.color;
    let stroke = t.border;
    let lw = 2;

    if (hex === hoveredHex) {
      stroke = t.impassable ? '#f87171' : '#f5b041';
      lw = 3;
    }

    drawHexagon(x, y, HEX_RADIUS - 2, fill, stroke, lw);

    // 地形アイコン
    if (!hex.district && t.icon) {
      ctx.font = '20px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(t.icon, x, y);
    }

    // 建設済み区域
    if (hex.district) {
      const d = DISTRICTS[hex.district];
      drawHexagon(x, y, HEX_RADIUS - 8, d.color, '#ffffff', 2);

      const yData = currentCalc.results.get(hex);
      const pData = previewCalc ? previewCalc.results.get(hex) : null;

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(d.name.split(' ')[0], x, y - 10);

      // 出力数値（プレビュー変化があれば差分表示）
      if (pData && pData.final !== yData.final) {
        ctx.fillStyle = '#2ecc71';
        ctx.font = 'bold 13px sans-serif';
        ctx.fillText(`+${yData.final}→+${pData.final}`, x, y + 12);
      } else {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 15px sans-serif';
        ctx.fillText(`+${yData.final}`, x, y + 12);
      }
    }
    // 都市計画ピン
    else if (hex.pin) {
      const d = DISTRICTS[hex.pin];
      ctx.save();
      ctx.globalAlpha = 0.55;
      drawHexagon(x, y, HEX_RADIUS - 10, d.color, '#38bdf8', 2);
      ctx.restore();
      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('📌' + d.name.split(' ')[0], x, y);
    }
  });

  // 2. プレビュービームと予測スコアの描画
  if (canPreview && previewCalc) {
    const { x, y } = hexToPixel(hoveredHex.q, hoveredHex.r);
    const d = DISTRICTS[selectedDistrict];

    // 接続ビーム
    previewCalc.beams.forEach(b => {
      const p1 = hexToPixel(b.from.q, b.from.r);
      const p2 = hexToPixel(b.to.q, b.to.r);
      ctx.save();
      ctx.beginPath();
      ctx.setLineDash([5, 5]);
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.lineWidth = 3;
      ctx.strokeStyle = b.isOutgoing ? '#2ecc71' : '#f5b041';
      ctx.stroke();
      ctx.restore();
    });

    // プレビュータイル本体
    ctx.save();
    ctx.globalAlpha = 0.85;
    drawHexagon(x, y, HEX_RADIUS - 7, d.color, '#f5b041', 3);
    ctx.restore();

    const pYield = previewCalc.results.get(hoveredHex);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(d.name.split(' ')[0], x, y - 10);

    ctx.fillStyle = '#f5b041';
    ctx.font = 'bold 16px sans-serif';
    ctx.fillText(`+${pYield ? pYield.final : 0}`, x, y + 12);
  }
}

init();
</script>
</body>
</html>
